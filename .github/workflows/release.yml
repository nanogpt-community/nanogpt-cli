name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string
      target_commitish:
        description: "Commit/branch to tag if tag does not exist (default: current SHA)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: blacksmith-4vcpu-ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: nanogpt-cli-linux-x64
          - name: macos-arm64
            # Blacksmith currently documents Linux/Windows runner labels; use GitHub-hosted arm64 macOS.
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: nanogpt-cli-macos-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          BIN="target/${{ matrix.target }}/release/nanogpt-cli"
          ARCHIVE="${{ matrix.archive }}-${TAG}.tar.gz"
          tar -C "$(dirname "$BIN")" -czf "$ARCHIVE" "$(basename "$BIN")"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}-${{ github.event.inputs.tag }}.tar.gz
            ${{ matrix.archive }}-${{ github.event.inputs.tag }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2204

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.event.inputs.target_commitish != '' && github.event.inputs.target_commitish || github.sha }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
